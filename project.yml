name: ClaudeAccountFee
options:
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 1.2.0
  Pow:
    url: https://github.com/movingparts-io/pow
    from: 1.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0
targets:
  ClaudeAccountFee:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClaudeAccount
    dependencies:
      - package: KeyboardShortcuts
      - package: Pow
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.claudeaccount
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "6.0"
