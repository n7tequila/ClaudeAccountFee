name: ClaudeAccountFee
options:
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 1.2.0
  Pow:
    url: https://github.com/movingparts-io/pow
    from: 1.0.0
targets:
  ClaudeAccountFee:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClaudeAccount
    dependencies:
      - package: KeyboardShortcuts
      - package: Pow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tequila.claudeaccount
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
